[platformio]
default_envs = freenove_esp32_s3_wroom

[env:freenove_esp32_s3_wroom]
platform = espressif32@7.1.3
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<*> -<board_test.cpp> -<imu_test.cpp>

lib_deps =
    https://github.com/finani/ICM42688.git#b417e0ab80650201dcb321a3d306a8d51464a20a

; First experiment: USB serial messages and an optional external LED on GPIO 4.
[env:board_test]
platform = espressif32@7.1.3
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = -<*> +<board_test.cpp>

; Sensor-only SPI diagnostic. No external IMU library or motor outputs.
[env:imu_test]
extends = env:board_test
build_src_filter = -<*> +<imu_test.cpp>

; Calibrated small-angle attitude demonstration, USB powered, no motor outputs.
[env:attitude_test]
extends = env:imu_test
build_flags = ${env:board_test.build_flags} -DATTITUDE_TEST

; Step 2: PID terms printed to serial only. No motor commands.
[env:pid_demo]
extends = env:attitude_test
build_flags = ${env:attitude_test.build_flags} -DPID_DEMO
